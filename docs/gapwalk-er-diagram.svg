<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GapWalk data model ER diagram</title>
  <desc id="desc">Entity relationship diagram for GapWalk local and research data, including schedule sources, busy events, preferences, nudge plans, walk sessions, route points, pause events, analytics events, crash reports, and achievements.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowDashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 38px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #475569; }
      .entity { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .core { fill: #eaf3fc; stroke: #6f9cc9; stroke-width: 2.5; }
      .walk { fill: #ecfdf5; stroke: #65a87b; stroke-width: 2.5; }
      .observe { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .entity-title { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 21px; font-weight: 750; fill: #0f172a; }
      .field { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
      .key { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 750; fill: #064e3b; }
      .rel { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .note { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #64748b; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 9 7; marker-end: url(#arrowDashed); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="70" y="70">GapWalk Data Model For Study Design</text>
  <text class="subtitle" x="70" y="106">What the implemented app can store locally and optionally sync to the research backend</text>

  <!-- Schedule side -->
  <rect class="core" x="70" y="170" width="270" height="154" rx="14"/>
  <text class="entity-title" x="92" y="206">ScheduleSource</text>
  <text class="key" x="92" y="238">id</text>
  <text class="field" x="92" y="264">type: manual | ics | google</text>
  <text class="field" x="92" y="290">filename, importedAt</text>

  <rect class="core" x="70" y="390" width="270" height="176" rx="14"/>
  <text class="entity-title" x="92" y="426">BusyEvent</text>
  <text class="key" x="92" y="458">id</text>
  <text class="field" x="92" y="484">title</text>
  <text class="field" x="92" y="510">start, end</text>
  <text class="field" x="92" y="536">source, isAllDay</text>

  <rect class="core" x="70" y="632" width="270" height="176" rx="14"/>
  <text class="entity-title" x="92" y="668">ManualScheduleEntry</text>
  <text class="key" x="92" y="700">id</text>
  <text class="field" x="92" y="726">title, dayOfWeek</text>
  <text class="field" x="92" y="752">startTime, endTime</text>
  <text class="field" x="92" y="778">oneTimeDate optional</text>

  <!-- Preferences + plans -->
  <rect class="core" x="470" y="170" width="310" height="206" rx="14"/>
  <text class="entity-title" x="492" y="206">Preference</text>
  <text class="key" x="492" y="238">id = singleton</text>
  <text class="field" x="492" y="264">dailyTargetMinutes</text>
  <text class="field" x="492" y="290">buffer, quietHours</text>
  <text class="field" x="492" y="316">minWalk, gracePeriod</text>
  <text class="field" x="492" y="342">reminder count + spacing</text>

  <rect class="core" x="470" y="470" width="310" height="228" rx="14"/>
  <text class="entity-title" x="492" y="506">NudgePlan</text>
  <text class="key" x="492" y="538">id</text>
  <text class="field" x="492" y="564">date</text>
  <text class="field" x="492" y="590">gapStart, gapEnd</text>
  <text class="field" x="492" y="616">walkStart, duration</text>
  <text class="field" x="492" y="642">status, reason</text>
  <text class="field" x="492" y="668">notificationsEnabled</text>

  <rect class="observe" x="470" y="760" width="310" height="112" rx="14"/>
  <text class="entity-title" x="492" y="796">AnalyticsEvent</text>
  <text class="key" x="492" y="828">id</text>
  <text class="field" x="492" y="854">name, payload, createdAt</text>

  <!-- Walk side -->
  <rect class="walk" x="900" y="300" width="330" height="270" rx="14"/>
  <text class="entity-title" x="922" y="336">WalkSession</text>
  <text class="key" x="922" y="368">id</text>
  <text class="field" x="922" y="394">nudgePlanId optional</text>
  <text class="field" x="922" y="420">start, end</text>
  <text class="field" x="922" y="446">activeSeconds, pausedSeconds</text>
  <text class="field" x="922" y="472">steps, distanceMeters</text>
  <text class="field" x="922" y="498">stepSource, motionConfidence</text>
  <text class="field" x="922" y="524">sensorHealth, latency</text>

  <rect class="walk" x="1290" y="170" width="240" height="154" rx="14"/>
  <text class="entity-title" x="1312" y="206">RoutePoint</text>
  <text class="key" x="1312" y="238">id</text>
  <text class="field" x="1312" y="264">sessionId</text>
  <text class="field" x="1312" y="290">lat, lon, accuracy</text>

  <rect class="walk" x="1290" y="390" width="240" height="176" rx="14"/>
  <text class="entity-title" x="1312" y="426">PauseEvent</text>
  <text class="key" x="1312" y="458">id</text>
  <text class="field" x="1312" y="484">sessionId</text>
  <text class="field" x="1312" y="510">pauseStartedAt</text>
  <text class="field" x="1312" y="536">duration, source, reason</text>

  <rect class="observe" x="900" y="690" width="270" height="134" rx="14"/>
  <text class="entity-title" x="922" y="726">Achievement</text>
  <text class="key" x="922" y="758">id</text>
  <text class="field" x="922" y="784">achievementId</text>
  <text class="field" x="922" y="810">unlockedAt</text>

  <rect class="observe" x="1260" y="690" width="270" height="134" rx="14"/>
  <text class="entity-title" x="1282" y="726">CrashReport</text>
  <text class="key" x="1282" y="758">id</text>
  <text class="field" x="1282" y="784">message, stack</text>
  <text class="field" x="1282" y="810">context, createdAt</text>

  <!-- Relationships -->
  <path class="line" d="M205 324 V390"/>
  <text class="rel" x="220" y="362">1 to many</text>

  <path class="line" d="M205 324 C205 600 205 600 205 632"/>
  <text class="rel" x="220" y="602">1 to many</text>

  <path class="dash" d="M340 478 C400 478 410 584 470 584"/>
  <text class="rel" x="352" y="530">gapEngine uses</text>

  <path class="dash" d="M780 272 C830 272 840 470 900 470"/>
  <text class="rel" x="804" y="348">preferences shape plans</text>

  <path class="line" d="M780 584 H900"/>
  <text class="rel" x="808" y="574">0..1 plan starts</text>

  <path class="line" d="M1230 390 C1262 330 1262 270 1290 252"/>
  <text class="rel" x="1246" y="330">1 to many</text>

  <path class="line" d="M1230 478 H1290"/>
  <text class="rel" x="1248" y="468">1 to many</text>

  <path class="dash" d="M1065 570 V690"/>
  <text class="rel" x="1080" y="630">computed from sessions</text>

  <path class="dash" d="M780 816 C852 816 842 524 900 524"/>
  <text class="rel" x="802" y="758">events describe behavior</text>

  <path class="dash" d="M1170 758 H1260"/>
  <text class="rel" x="1188" y="746">observability</text>

  <rect class="observe" x="70" y="902" width="1460" height="50" rx="14"/>
  <text class="note" x="96" y="933">Note: nudge response is inferred from NudgePlan status/reason plus AnalyticsEvent records; there is no dedicated nudge_response table in the mobile app.</text>
</svg>
